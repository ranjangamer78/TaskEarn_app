      /**
       * TaskEarn Google Drive Direct Download Engine
       * Converts any standard Google Drive file URL to direct download stream
       */
      window.extractGoogleDriveId = function(url) {
        if (!url) return null;
        var dMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]{20,})/);
        if (dMatch && dMatch[1]) return dMatch[1];
        var idMatch = url.match(/[?&]id=([a-zA-Z0-9_-]{20,})/);
        if (idMatch && idMatch[1]) return idMatch[1];
        var openMatch = url.match(/\/open\?id=([a-zA-Z0-9_-]{20,})/);
        if (openMatch && openMatch[1]) return openMatch[1];
        return /^[a-zA-Z0-9_-]{25,50}$/.test(url.trim()) ? url.trim() : null;
      };

      window.getGoogleDriveDirectLink = function(driveUrl) {
        var id = window.extractGoogleDriveId(driveUrl);
        if (id) {
          return 'https://drive.google.com/uc?export=download&id=' + id + '&confirm=t';
        }
        return driveUrl;
      };

      window.downloadTaskEarnApk = function(url, filename) {
        filename = filename || 'TaskEarn_v2.4.1.apk';
        var direct = window.getGoogleDriveDirectLink(url || 'https://drive.google.com/file/d/13tb91ZrJ8WYcOzvoxFmOZ14GtFRpKr9r/view?usp=drive_link');
        var a = document.createElement('a');
        a.href = direct;
        a.download = filename;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };
    </script>
